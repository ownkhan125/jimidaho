<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Story 10 — Swipe Up CTA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif;padding:20px}
  .story{
    width:540px;height:960px;position:relative;overflow:hidden;color:#fff;
    background:
      linear-gradient(180deg, rgba(0,0,4,.6) 0%, rgba(0,0,4,.2) 30%, rgba(0,0,4,.7) 75%, rgba(0,0,4,.98) 100%),
      url('https://images.unsplash.com/photo-1494891848038-7bd202a2afeb?w=900&q=80') center/cover;
  }
  .brand-top{position:absolute;top:50px;left:30px;font-family:'Playfair Display',serif;font-weight:900;font-size:13px;letter-spacing:2px;color:#fff;z-index:10}
  .brand-top .r{color:#FF0D00}
  .brand-meta{position:absolute;top:50px;right:30px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600;z-index:10}
  .badge-top{
    position:absolute;top:110px;left:50%;transform:translateX(-50%);
    background:#FF0D00;padding:10px 18px;font-size:10px;letter-spacing:4px;text-transform:uppercase;font-weight:700;z-index:5;
  }
  .heading{
    position:absolute;top:190px;left:30px;right:30px;text-align:center;z-index:5;
  }
  .heading .eyebrow{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:28px;color:rgba(255,255,255,.85)}
  .heading h1{
    font-family:'Playfair Display',serif;font-weight:900;font-size:70px;line-height:.95;letter-spacing:-2px;
    margin-top:12px;
  }
  .heading h1 em{font-style:italic;color:#FF5C50;font-weight:400}
  .meta-list{
    position:absolute;left:30px;right:30px;top:530px;z-index:5;
    display:flex;flex-direction:column;gap:12px;
  }
  .meta-list .row{
    display:flex;align-items:center;gap:14px;
    background:rgba(255,255,255,.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.15);
    padding:14px 18px;
  }
  .meta-list .row .icon{
    width:36px;height:36px;border-radius:50%;background:#FF0D00;display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-weight:900;font-size:16px;
  }
  .meta-list .row .lbl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700}
  .meta-list .row .val{font-family:'Playfair Display',serif;font-weight:700;font-size:16px;margin-top:2px}
  .cta-wrap{
    position:absolute;left:0;right:0;bottom:40px;text-align:center;z-index:10;
  }
  .pill{
    display:inline-flex;align-items:center;gap:16px;
    background:#fff;color:#000004;padding:18px 30px;border-radius:99px;
    font-size:12px;letter-spacing:3px;text-transform:uppercase;font-weight:800;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .pill .dot{width:8px;height:8px;background:#FF0D00;border-radius:50%}
  .pill .arrow{color:#FF0D00;font-family:'Playfair Display',serif;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="story">
  <div class="brand-top"><span class="r">●</span> LOREM IPSUM</div>
  <div class="brand-meta">No. 10 / Series</div>
  <div class="badge-top">— Last Call —</div>
  <div class="heading">
    <div class="eyebrow">Don't miss this</div>
    <h1>Join the <em>movement</em><br/>today.</h1>
  </div>
  <div class="meta-list">
    <div class="row"><div class="icon">①</div><div><div class="lbl">Step One</div><div class="val">Lorem ipsum dolor sit</div></div></div>
    <div class="row"><div class="icon">②</div><div><div class="lbl">Step Two</div><div class="val">Consectetur adipiscing</div></div></div>
    <div class="row"><div class="icon">③</div><div><div class="lbl">Step Three</div><div class="val">Sed do eiusmod tempor</div></div></div>
  </div>
  <div class="cta-wrap">
    <div class="pill"><span class="dot"></span>Get Started Today<span class="arrow">→</span></div>
  </div>
</div>
</body>
</html>
