<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feed 06 — Statistic Hero</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
  .post{
    width:1080px;height:1080px;position:relative;overflow:hidden;color:#fff;
    background:radial-gradient(circle at 70% 30%, #0068E3 0%, #003680 30%, #001A3E 60%, #000004 100%);
  }
  .noise{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:4px 4px;pointer-events:none}
  .glow{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle, rgba(255,13,0,.3) 0%, transparent 60%);top:-150px;right:-150px;filter:blur(40px)}
  .top-row{position:absolute;top:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:4px;text-transform:uppercase}
  .top-row .left{display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.7)}
  .top-row .dot{width:8px;height:8px;background:#FF0D00;border-radius:50%;box-shadow:0 0 12px #FF0D00}
  .top-row .right{color:rgba(255,255,255,.5)}
  .eyebrow{
    position:absolute;left:60px;top:240px;
    font-size:13px;letter-spacing:6px;text-transform:uppercase;color:#FF5C50;font-weight:600;
  }
  .stat{
    position:absolute;left:50px;top:280px;right:50px;text-align:center;
    font-family:'Playfair Display',serif;font-weight:900;font-size:580px;line-height:.85;letter-spacing:-25px;
    background:linear-gradient(180deg, #fff 0%, #fff 60%, rgba(255,255,255,.4) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .stat .pct{color:#FF0D00;-webkit-text-fill-color:#FF0D00;font-style:italic;font-weight:400;font-size:280px;vertical-align:super;margin-left:-30px}
  .underline-text{
    position:absolute;left:60px;right:60px;top:830px;text-align:center;
    font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:42px;line-height:1.2;
    color:#fff;
  }
  .underline-text strong{font-style:normal;font-weight:900;color:#FF5C50}
  .bottom{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center}
  .bottom .src{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4)}
  .bottom .brand{font-family:'Playfair Display',serif;font-weight:900;font-size:13px;letter-spacing:2px}
  .bottom .brand .r{color:#FF0D00}
  .frame{position:absolute;inset:30px;border:1px solid rgba(255,255,255,.08);pointer-events:none}
</style>
</head>
<body>
<div class="post">
  <div class="glow"></div>
  <div class="noise"></div>
  <div class="frame"></div>
  <div class="top-row">
    <div class="left"><span class="dot"></span>Data Report · Q2</div>
    <div class="right">No. 06 / 10</div>
  </div>
  <div class="eyebrow" style="text-align:center;left:0;right:0">— Lorem Ipsum Index —</div>
  <div class="stat">87<span class="pct">%</span></div>
  <div class="underline-text">of communities believe <strong>change</strong><br/>is long overdue.</div>
  <div class="bottom">
    <div class="src">Source · Lorem Survey, 2026</div>
    <div class="brand"><span class="r">●</span> LOREM IPSUM</div>
  </div>
</div>
</body>
</html>
