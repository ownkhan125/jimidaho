<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Story 03 — Countdown</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400;1,900&family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif;padding:20px}
  .story{
    width:540px;height:960px;position:relative;overflow:hidden;color:#fff;
    background:#000004;
  }
  .red-block{position:absolute;top:0;left:0;right:0;height:520px;background:linear-gradient(180deg,#FF0D00 0%, #D80B00 100%)}
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);background-size:4px 4px;pointer-events:none}
  .side-rule{
    position:absolute;top:240px;bottom:520px;left:18px;width:2px;background:rgba(255,255,255,.25);pointer-events:none;
  }
  .side-rule::before{content:'';position:absolute;top:0;left:-3px;width:8px;height:8px;background:#fff;border-radius:50%}
  .side-rule::after{content:'';position:absolute;bottom:0;left:-3px;width:8px;height:8px;background:#fff;border-radius:50%}
  .brand-top{position:absolute;top:50px;left:40px;font-family:'Playfair Display',serif;font-weight:900;font-size:14px;letter-spacing:2px;color:#fff;z-index:5}
  .brand-top .r{color:#000004}
  .brand-meta{position:absolute;top:50px;right:40px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:700;z-index:5}
  .eyebrow{position:absolute;top:170px;left:0;right:0;text-align:center;font-size:11px;letter-spacing:6px;text-transform:uppercase;font-weight:700;z-index:5;color:#fff}
  .countdown{
    position:absolute;top:215px;left:0;right:0;text-align:center;z-index:5;
    font-family:'Playfair Display',serif;font-weight:900;font-size:260px;line-height:.85;letter-spacing:-10px;color:#fff;
  }
  .countdown .days{font-family:'Playfair Display',serif;font-weight:400;font-style:italic;font-size:46px;display:block;letter-spacing:8px;text-transform:uppercase;margin-top:18px;color:#fff}
  .info-card{
    position:absolute;left:30px;right:30px;top:600px;
    background:#fff;color:#000004;padding:30px;
    z-index:5;border-left:4px solid #FF0D00;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .info-card .label{font-size:9px;letter-spacing:4px;text-transform:uppercase;color:#9C958C;font-weight:700;margin-bottom:10px}
  .info-card .title{font-family:'Playfair Display',serif;font-weight:900;font-size:30px;line-height:1.05;letter-spacing:-1px}
  .info-card .title em{font-style:italic;color:#FF0D00;font-weight:400}
  .info-card .meta{margin-top:22px;display:flex;justify-content:space-between;gap:14px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#3A3632;border-top:1px solid #E8E4DF;padding-top:16px}
  .info-card .meta strong{font-family:'Playfair Display',serif;font-weight:900;font-size:14px;display:block;color:#000004;margin-top:6px;letter-spacing:0}
  .cta-pill{
    position:absolute;left:30px;right:30px;bottom:40px;
    background:#FF0D00;padding:18px 24px;text-align:center;
    font-size:12px;letter-spacing:4px;text-transform:uppercase;font-weight:700;z-index:5;
  }
</style>
</head>
<body>
<div class="story">
  <div class="red-block"></div>
  <div class="side-rule"></div>
  <div class="grain"></div>
  <div class="brand-top"><span class="r">●</span> LOREM IPSUM</div>
  <div class="brand-meta">No. 03 / Series</div>
  <div class="eyebrow">— Until the gathering —</div>
  <div class="countdown">14<span class="days">days to go</span></div>
  <div class="info-card">
    <div class="label">Mark your calendar</div>
    <div class="title">The Town Hall <em>Gathering.</em></div>
    <div class="meta">
      <div>Date<strong>Sep 14</strong></div>
      <div>Time<strong>6:30 PM</strong></div>
      <div>Venue<strong>Civic Hall</strong></div>
    </div>
  </div>
  <div class="cta-pill">RSVP Today →</div>
</div>
</body>
</html>
