<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Story 06 — Vertical Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400;1,900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif;padding:20px}
  .story{
    width:540px;height:960px;position:relative;overflow:hidden;color:#fff;
    background:linear-gradient(180deg, #000004 0%, #001A3E 50%, #003680 100%);
  }
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px);background-size:3px 3px;pointer-events:none}
  .glow{position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle, rgba(255,13,0,.25) 0%, transparent 70%);top:-100px;right:-100px;filter:blur(30px)}
  .brand-top{position:absolute;top:50px;left:30px;font-family:'Playfair Display',serif;font-weight:900;font-size:13px;letter-spacing:2px;color:#fff;z-index:5}
  .brand-top .r{color:#FF0D00}
  .brand-meta{position:absolute;top:50px;right:30px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:600;z-index:5}
  .heading{
    position:absolute;top:120px;left:30px;right:30px;z-index:5;
  }
  .heading .eyebrow{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#FF5C50;font-weight:700;margin-bottom:10px}
  .heading h1{font-family:'Playfair Display',serif;font-weight:900;font-size:48px;line-height:.95;letter-spacing:-1px}
  .heading h1 em{font-style:italic;color:#FF5C50;font-weight:400}
  .heading .divider{height:1px;background:rgba(255,255,255,.2);margin-top:24px}
  .stats{position:absolute;left:30px;right:30px;top:330px;display:flex;flex-direction:column;gap:24px;z-index:5}
  .stat-row{display:flex;align-items:flex-end;gap:20px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.1)}
  .stat-row .num{
    font-family:'Playfair Display',serif;font-weight:900;font-size:120px;line-height:.85;letter-spacing:-4px;
    background:linear-gradient(180deg,#fff 0%,#fff 60%,rgba(255,255,255,.4) 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    min-width:160px;
  }
  .stat-row .num .pct{color:#FF0D00;-webkit-text-fill-color:#FF0D00;font-size:50px;vertical-align:super;font-style:italic;font-weight:400}
  .stat-row .info{flex:1;padding-bottom:8px}
  .stat-row .info .lbl{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);font-weight:700}
  .stat-row .info .desc{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;color:#fff;line-height:1.3;margin-top:4px}
  .footer{position:absolute;left:30px;right:30px;bottom:50px;display:flex;justify-content:space-between;align-items:center;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.5);z-index:5}
  .footer .brand{font-family:'Playfair Display',serif;font-weight:900;color:#fff;font-size:13px;letter-spacing:1px}
  .footer .brand .r{color:#FF0D00}
</style>
</head>
<body>
<div class="story">
  <div class="glow"></div>
  <div class="grain"></div>
  <div class="brand-top"><span class="r">●</span> LOREM IPSUM</div>
  <div class="brand-meta">No. 06 / Series</div>
  <div class="heading">
    <div class="eyebrow">— Report 06</div>
    <h1>The numbers <em>tell</em><br/>a story.</h1>
    <div class="divider"></div>
  </div>
  <div class="stats">
    <div class="stat-row">
      <div class="num">87<span class="pct">%</span></div>
      <div class="info"><div class="lbl">Lorem rate</div><div class="desc">support for action</div></div>
    </div>
    <div class="stat-row">
      <div class="num">12k</div>
      <div class="info"><div class="lbl">Ipsum index</div><div class="desc">conversations had</div></div>
    </div>
    <div class="stat-row" style="border:none">
      <div class="num">240</div>
      <div class="info"><div class="lbl">Dolor sit</div><div class="desc">communities reached</div></div>
    </div>
  </div>
  <div class="footer">
    <span class="brand"><span class="r">●</span> LOREM IPSUM</span>
    <span>Source · 2026</span>
  </div>
</div>
</body>
</html>
