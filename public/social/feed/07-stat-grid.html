<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feed 07 — Stat Grid</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
  .post{
    width:1080px;height:1080px;position:relative;overflow:hidden;color:#000004;
    background:#F8F9FA;
    padding:60px;
  }
  .header{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:32px;border-bottom:2px solid #000004}
  .header .title{font-family:'Playfair Display',serif;font-weight:900;font-size:54px;line-height:1;letter-spacing:-1.5px}
  .header .title em{font-style:italic;color:#FF0D00;font-weight:400}
  .header .meta{text-align:right}
  .header .meta .label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9C958C}
  .header .meta .value{font-family:'Playfair Display',serif;font-weight:700;font-size:18px;margin-top:4px}
  .grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:24px;margin-top:32px;height:calc(100% - 230px)}
  .cell{padding:36px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
  .cell.dark{background:#000004;color:#fff}
  .cell.red{background:#FF0D00;color:#fff}
  .cell.cream{background:#F5F3F0;color:#000004;border:1px solid #E8E4DF}
  .cell.blue{background:linear-gradient(135deg,#003680 0%,#0068E3 100%);color:#fff}
  .cell .num{font-family:'Playfair Display',serif;font-weight:900;font-size:140px;line-height:.9;letter-spacing:-4px}
  .cell .num .small{font-size:60px;vertical-align:super;font-weight:400;font-style:italic}
  .cell .label{font-size:11px;letter-spacing:4px;text-transform:uppercase;opacity:.8}
  .cell .desc{font-family:'Playfair Display',serif;font-style:italic;font-size:18px;line-height:1.3;margin-top:8px}
  .cell .corner{position:absolute;top:24px;right:24px;font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.5}
  .footer{position:absolute;bottom:60px;left:60px;right:60px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#6B6560;display:none}
</style>
</head>
<body>
<div class="post">
  <div class="header">
    <div class="title">By the <em>numbers.</em></div>
    <div class="meta">
      <div class="label">Report</div>
      <div class="value">Vol. 07 / 2026</div>
    </div>
  </div>
  <div class="grid">
    <div class="cell dark">
      <div class="corner">01</div>
      <div class="label">Lorem rate</div>
      <div>
        <div class="num">12<span class="small">k</span></div>
        <div class="desc">conversations sparked</div>
      </div>
    </div>
    <div class="cell red">
      <div class="corner">02</div>
      <div class="label">Ipsum index</div>
      <div>
        <div class="num">+38<span class="small">%</span></div>
        <div class="desc">since last cycle</div>
      </div>
    </div>
    <div class="cell cream">
      <div class="corner">03</div>
      <div class="label">Dolor sit</div>
      <div>
        <div class="num" style="color:#000004">96<span class="small" style="color:#FF0D00">.4</span></div>
        <div class="desc" style="color:#3A3632">retention score</div>
      </div>
    </div>
    <div class="cell blue">
      <div class="corner">04</div>
      <div class="label">Amet</div>
      <div>
        <div class="num">240</div>
        <div class="desc">communities reached</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
