<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Feed 05 — Testimonial Portrait</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#1a1a1a;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Montserrat',sans-serif}
  .post{width:1080px;height:1080px;position:relative;overflow:hidden;background:#E8E4DF;color:#000004}
  .left-panel{
    position:absolute;left:0;top:0;bottom:0;width:54%;
    background:url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=900&q=80') center/cover;
  }
  .left-panel::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(0,0,4,.35) 0%, rgba(0,26,62,.1) 100%);
  }
  .right-panel{
    position:absolute;right:0;top:0;bottom:0;width:46%;
    background:#F8F9FA;padding:80px 60px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .eyebrow{display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#FF0D00;font-weight:600}
  .eyebrow .line{width:30px;height:1px;background:#FF0D00}
  .big-quote{
    font-family:'Playfair Display',serif;font-style:italic;font-weight:400;font-size:200px;
    line-height:.6;color:#FF0D00;margin-top:40px;
  }
  .quote-text{
    font-family:'Playfair Display',serif;font-weight:400;font-size:30px;line-height:1.3;letter-spacing:-.5px;color:#000004;
    margin-top:-10px;
  }
  .quote-text em{font-style:italic;color:#003680}
  .attribution{margin-top:auto}
  .attribution .name{font-family:'Playfair Display',serif;font-weight:900;font-size:24px;color:#000004}
  .attribution .role{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6B6560;margin-top:6px}
  .attribution .bar{width:40px;height:2px;background:#FF0D00;margin-top:24px}
  .left-tag{
    position:absolute;left:40px;bottom:40px;color:#fff;font-size:10px;letter-spacing:3px;text-transform:uppercase;
    backdrop-filter:blur(8px);background:rgba(255,255,255,.1);padding:10px 16px;border:1px solid rgba(255,255,255,.2);
  }
  .right-corner{position:absolute;top:40px;right:40px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#9C958C}
  .brand-mark{position:absolute;bottom:40px;left:40px;font-family:'Playfair Display',serif;font-weight:900;font-size:14px;color:#fff;letter-spacing:2px;display:none}
</style>
</head>
<body>
<div class="post">
  <div class="left-panel">
    <div class="left-tag">Voices · 023</div>
  </div>
  <div class="right-panel">
    <div>
      <div class="eyebrow"><span class="line"></span>Testimonial</div>
      <div class="big-quote">"</div>
      <div class="quote-text">Lorem ipsum dolor sit amet, <em>consectetur adipiscing</em> — it changed how I see our community forever.</div>
    </div>
    <div class="attribution">
      <div class="bar"></div>
      <div style="margin-top:24px"></div>
      <div class="name">Margaux Delacroix</div>
      <div class="role">Local Resident · District 4</div>
    </div>
    <div class="right-corner">@loremipsum</div>
  </div>
</div>
</body>
</html>
